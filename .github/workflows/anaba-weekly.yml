name: 大穴レポート：週次の学習・答え合わせ・血統検証

on:
  schedule:
    - cron: "0 12 * * 2"   # 火 21:00 JST（jra2 の成績データが月・火の朝に更新された後）
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去レースの血統を集めるリクエスト数の上限（0で集めない）"
        default: "2500"
      bench:
        description: "総当たり検証も今回行う（yes/no。ふだんは毎月第1週だけ）"
        default: "no"

permissions:
  contents: write

concurrency:
  group: anaba-git
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Tokyo
      JRA2_REPO: ${{ github.workspace }}/jra2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: otakuan-pixel/jra2
          path: jra2
          sparse-checkout: |
            data/results
            data/text
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --quiet -r requirements.txt

      - name: 答え合わせ（先週のレポート）
        run: python -m anaba settle

      - name: 過去レースの血統を少しずつ集める（netkeiba、1.1秒間隔）
        run: |
          N="${{ inputs.backfill }}"
          [ -z "$N" ] && N=2500
          [ "$N" != "0" ] && timeout 4500 python -m anaba backfill --since 20210101 --max-requests "$N" || true

      - name: 全レースの払戻（全券種）を足す（券種の比較用。新しい週の分だけ）
        run: timeout 1800 python -m anaba payouts --since 20250101 --max-requests 1200 || true

      - name: 血統の検証（奇跡の血量など）
        run: python -m anaba pedstudy

      - name: 再学習（複勝払戻・条件表・ウォークフォワード検証・本番モデル）
        run: python -m anaba train

      - name: 予測方法・運用ルールの総当たり検証（毎月第1週だけ。約30分）
        run: |
          if [ "$(date +%d)" -le 07 ] || [ "${{ inputs.bench }}" = "yes" ]; then
            python -m anaba bench --rebuild
          else
            echo "今週は省略（毎月第1週に実行）"
          fi

      - name: コミット
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "週次の学習・答え合わせ $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
