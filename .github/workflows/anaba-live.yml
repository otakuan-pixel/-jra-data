name: 大穴レポート（発走30分前）

# GitHub の定時起動は数時間遅れることがある（10分おきの起動は1回も来ない日もあった）。
# そこで朝に起動したジョブが夕方まで常駐し、1分ごとに「発走28〜32分前」のレースを判定する。
# 起動は1日に4回（6時・9時・12時・14時 JST）。同時には1つしか動かず、後から来た起動は前のジョブが
# 終わる（最長5時間45分）のを待ってから続きを引き継ぐ。その日の全レースを報告済みなら、すぐ終わる。
on:
  schedule:
    - cron: "0 21 * * 5,6,0"     # 土・日・月の 6:00 JST
    - cron: "0 0,3,5 * * 6,0,1"  # 土・日・月の 9:00・12:00・14:00 JST（予備）
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYYMMDD（空欄なら今日）"
        default: ""
      race:
        description: "このレースだけ今すぐ報告（例 05_11）。空欄なら常駐して夕方まで自動"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: anaba-git
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Tokyo
      JRA2_REPO: ${{ github.workspace }}/jra2
      GH_TOKEN: ${{ github.token }}
      ANABA_WEBHOOK_URL: ${{ secrets.ANABA_WEBHOOK_URL }}
      ANABA_NOTIFY: ${{ vars.ANABA_NOTIFY || 'buy' }}
    steps:
      - uses: actions/checkout@v4

      - name: 成績データ（otakuan-pixel/jra2 の data/results だけ）
        uses: actions/checkout@v4
        with:
          repository: otakuan-pixel/jra2
          path: jra2
          sparse-checkout: data/results

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存パッケージ
        run: pip install --quiet -r requirements.txt

      - name: git の設定
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: レポート（常駐。報告のたびにコミットと通知）
        run: |
          ARGS=""
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }}"
          if [ -n "${{ inputs.race }}" ]; then
            python -m anaba live $ARGS --race "${{ inputs.race }}"
          else
            python -m anaba loop $ARGS --max-minutes 345
          fi

      - name: コミット（残り）
        if: always()
        run: |
          git add reports data/pedigree data/horses.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "大穴レポート $(date +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
